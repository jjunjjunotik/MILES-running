# Fly.io 배포 설정. 처음 한 번 app 이름만 바꾸면 된다(README "배포" 참고).
#
# 서버는 한 대만 둔다. 데이터베이스가 볼륨의 파일 하나(SQLite)라서
# 두 대가 같은 파일을 나눠 쓸 수 없기 때문이다. 배포할 때 --ha=false 를 붙인다.
# 지역은 미국 서부(산호세)다. 미국과 한국 양쪽에서 가장 무난하게 가깝다.

app = "nailsense"
primary_region = "sjc"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "true"
  PADDLE_ENV = "sandbox"

[[mounts]]
  source = "nailsense_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # 볼륨이 붙은 한 대가 늘 떠 있어야 웹훅을 놓치지 않는다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
